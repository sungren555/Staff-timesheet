<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDU Staff Timesheet Submission Form</title>

    <!-- PWA / Add-to-Home-Screen setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">

    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- iOS "Add to Home Screen" support -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Timesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --label-color: #444444;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --input-text: #000000;
            --th-bg: #f2f2f2;
            --th-color: #333333;
            --td-border: #ddd;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #b0b0b0;
            --input-bg: #2d2d2d;
            --input-border: #444;
            --input-text: #ffffff;
            --th-bg: #2c2c2c;
            --th-color: #ffffff;
            --td-border: #333;
        }

        body {
            font-family: 'Siemreap', 'Khmer OS Battambang', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 1050px;
            margin: auto;
            background: var(--container-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--input-border);
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        h2 {
            text-align: center;
            color: #1a73e8;
            font-size: 20px;
            margin-bottom: 20px;
            padding-right: 40px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--label-color);
        }

        select, input {
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 14px;
            background-color: var(--input-bg);
            color: var(--input-text);
            width: 100%;
            box-sizing: border-box;
        }

        h3 {
            font-size: 16px;
            margin-top: 25px;
            border-bottom: 2px solid #1a73e8;
            padding-bottom: 5px;
        }

        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
            max-height: 400px;
            border-radius: 6px;
            border: 1px solid var(--td-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid var(--td-border);
            padding: 6px 4px;
            text-align: center;
            font-size: 12px;
            white-space: nowrap;
        }

        th {
            background-color: var(--th-bg);
            color: var(--th-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .day-input-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 75px;
        }

        .activity-input, .amount-input {
            width: 100% !important;
            text-align: center;
            padding: 4px;
            font-size: 11px;
        }

        .btn-submit {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #1557b0;
        }

        #loading {
            display: none;
            text-align: center;
            color: #1a73e8;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
    </button>

    <h2>RISING PHOENIX CO., LTD<br><span style="font-size: 14px; color: #777;">Staff Timesheet Submission Form</span></h2>
    
    <form id="timesheetForm">
        <div class="form-row">
            <div class="form-group">
                <label for="staffName">ឈ្មោះបុគ្គលិក (Staff Name):</label>
                <select id="staffName" required>
                    <option value="">-- កំពុងទាញយកឈ្មោះបុគ្គលិក... --</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="monthYear">ខែ និងឆ្នាំ (Month & Year):</label>
                <input type="month" id="monthYear" value="2026-09" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="grossSalary">ប្រាក់ខែគោល (Gross Salary):</label>
                <input type="number" id="grossSalary" placeholder="ឧ. 500">
            </div>
            <div class="form-group">
                <label for="fieldAllowance">ប្រាក់ឧបត្ថម្ភទីវាល (Field Allowance):</label>
                <input type="number" id="fieldAllowance" placeholder="គណនាស្វ័យប្រវត្តិ" readonly style="background-color: var(--th-bg); font-weight: bold; color: #1a73e8;">
            </div>
        </div>

        <h3>តារាងសកម្មភាពប្រចាំថ្ងៃ (Daily Activities)</h3>
        <div class="table-responsive">
            <table id="daysTable">
                <thead>
                    <tr id="tableDays"></tr>
                </thead>
                <tbody>
                    <tr id="tableInputs"></tr>
                </tbody>
            </table>
        </div>

        <datalist id="activityListOptions"></datalist>

        <button type="button" class="btn-submit" onclick="saveData()">រក្សាទុក និងបញ្ជូនទិន្នន័យ (Submit Data)</button>
        <div id="loading">កំពុងបញ្ជូនទិន្នន័យទៅកាន់ Google Sheets... សូមរង់ចាំបន្តិច!</div>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzUoVPtNVo5WrZk4jkd8dCplJFs6l1ZWXYK2UXylyQi0j17YwAbPuEO7HHvJI8Zy9g_1Q/exec'; // <-- ជំនួស URL របស់អ្នកនៅទីនេះ

    let globalActivities = [];

    function toggleTheme() {
        const body = document.body;
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        
        if (body.getAttribute('data-theme') === 'light') {
            body.setAttribute('data-theme', 'dark');
            themeIcon.textContent = '☀️';
            themeText.textContent = 'Light';
        } else {
            body.setAttribute('data-theme', 'light');
            themeIcon.textContent = '🌙';
            themeText.textContent = 'Dark';
        }
    }

    function fetchMasterData() {
        fetch(scriptURL + '?action=getData')
            .then(response => response.json())
            .then(data => {
                if (data.status === "error") {
                    alert(data.message);
                    return;
                }

                const staffSelect = document.getElementById('staffName');
                staffSelect.innerHTML = '<option value="">-- ជ្រើសរើសឈ្មោះ --</option>';
                data.staffs.forEach(staff => {
                    const opt = document.createElement('option');
                    opt.value = staff;
                    opt.textContent = staff;
                    staffSelect.appendChild(opt);
                });

                globalActivities = data.activities;
                const datalist = document.getElementById('activityListOptions');
                datalist.innerHTML = '';
                data.activities.forEach(act => {
                    const opt = document.createElement('option');
                    opt.value = act;
                    datalist.appendChild(opt);
                });

                generateDays();
            })
            .catch(error => {
                console.error('Error fetching master data:', error);
                generateDays();
            });
    }

    function generateDays() {
        const monthYearInput = document.getElementById('monthYear').value;
        const [year, month] = monthYearInput.split('-');
        const daysInMonth = new Date(year, month, 0).getDate();
        
        const daysRow = document.getElementById('tableDays');
        const inputsRow = document.getElementById('tableInputs');
        
        daysRow.innerHTML = '';
        inputsRow.innerHTML = '';
        
        const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        for (let i = 1; i <= daysInMonth; i++) {
            const dateObj = new Date(year, month - 1, i);
            const dayName = weekdays[dateObj.getDay()];
            
            const th = document.createElement('th');
            th.innerHTML = `${dayName}<br>${i}`;
            daysRow.appendChild(th);
            
            const td = document.createElement('td');
            const container = document.createElement('div');
            container.className = 'day-input-container';

            const actInput = document.createElement('input');
            actInput.type = 'text';
            actInput.className = 'activity-input';
            actInput.name = `activity_${i}`;
            actInput.placeholder = 'សកម្មភាព';
            actInput.setAttribute('list', 'activityListOptions');

            const amtInput = document.createElement('input');
            amtInput.type = 'number';
            amtInput.className = 'amount-input';
            amtInput.name = `amount_${i}`;
            amtInput.placeholder = 'ទឹកប្រាក់';
            amtInput.oninput = calculateTotalAllowance; // គណនាទឹកប្រាក់សរុបអូតូ

            container.appendChild(actInput);
            container.appendChild(amtInput);
            td.appendChild(container);
            inputsRow.appendChild(td);
        }
        calculateTotalAllowance();
    }

    function calculateTotalAllowance() {
        let total = 0;
        const amountInputs = document.querySelectorAll('.amount-input');
        amountInputs.forEach(input => {
            const val = parseFloat(input.value);
            if (!isNaN(val)) {
                total += val;
            }
        });
        document.getElementById('fieldAllowance').value = total > 0 ? total : '';
    }

    document.getElementById('monthYear').addEventListener('change', generateDays);
    window.onload = fetchMasterData;

    function saveData() {
        const staff = document.getElementById('staffName').value;
        if (!staff) {
            alert('សូមជ្រើសរើសឈ្មោះបុគ្គលិកជាមុនសិន!');
            return;
        }

        const dailyData = {};
        const daysInMonthInput = document.getElementById('monthYear').value;
        const [y, m] = daysInMonthInput.split('-');
        const totalDays = new Date(y, m, 0).getDate();

        for (let i = 1; i <= totalDays; i++) {
            const actVal = document.querySelector(`[name="activity_${i}"]`).value;
            const amtVal = document.querySelector(`[name="amount_${i}"]`).value;
            
            if (actVal !== "" || amtVal !== "") {
                dailyData[`day_${i}`] = {
                    activity: actVal,
                    amount: amtVal
                };
            }
        }

        const formData = {
            staffName: staff,
            monthYear: document.getElementById('monthYear').value,
            grossSalary: document.getElementById('grossSalary').value,
            dailyActivities: dailyData
        };

        document.getElementById('loading').style.display = 'block';

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(response => {
            document.getElementById('loading').style.display = 'none';
            alert('ទិន្នន័យត្រូវបានបញ្ជូនចូល Google Sheets ដោយជោគជ័យ!');
            document.getElementById('timesheetForm').reset();
            document.getElementById('monthYear').value = `${y}-${m}`;
            generateDays();
        })
        .catch(error => {
            document.getElementById('loading').style.display = 'none';
            alert('មានបញ្ហាពេលបញ្ជូនទិន្នន័យ៖ ' + error);
        });
    }
</script>

</body>
</html>
